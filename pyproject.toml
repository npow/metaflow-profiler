[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metaflow-profiler"
version = "0.1.0"
description = "Interactive flamegraph profiling for Metaflow steps — pluggable backends, beautiful cards"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "metaflow>=2.12",
    "psutil>=5.9",
]
authors = [
    { name = "npow" },
]
keywords = [
    "metaflow",
    "profiling",
    "flamegraph",
    "performance",
    "cpu",
    "memory",
    "mlops",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/npow/metaflow-profiler"
Repository = "https://github.com/npow/metaflow-profiler"
Issues = "https://github.com/npow/metaflow-profiler/issues"

[project.optional-dependencies]
pyinstrument = ["pyinstrument>=4.0"]
memray = ["memray>=1.0"]
gpu = ["nvidia-ml-py>=12.0"]
all = ["pyinstrument>=4.0", "memray>=1.0", "nvidia-ml-py>=12.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "types-psutil>=5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/metaflow_extensions"]

[tool.ruff]
src = ["src"]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# card.py embeds JavaScript/HTML in multi-line strings; long lines and the
# intentional › breadcrumb separator are expected there.
"src/metaflow_extensions/profiler/plugins/cards/profile_card/card.py" = ["E501", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["metaflow_extensions"]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "structural: tests that enforce architectural constraints",
    "integration: tests that require a running Metaflow environment",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
